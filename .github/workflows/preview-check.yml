name: Preview Deployment Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview-gate:
    name: Verify Preview Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Run Build
        run: npm run build
